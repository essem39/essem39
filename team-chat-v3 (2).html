<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудит сайта — WINNER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f1f5f9;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 32px 20px;
            color: #0f172a;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        /* карточка */
        .card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: all 0.2s;
        }
        .card-header {
            padding: 28px 32px 12px 32px;
            border-bottom: 1px solid #e2e8f0;
        }
        .card-header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .card-header p {
            color: #475569;
            margin-top: 8px;
            font-size: 14px;
        }
        .card-body {
            padding: 28px 32px;
        }
        /* поля */
        .url-group {
            margin-bottom: 28px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
        }
        input[type="url"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            background: #fff;
            transition: 0.2s;
            font-family: inherit;
        }
        input[type="url"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .checks-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin: 20px 0 24px 0;
            background: #f8fafc;
            padding: 20px 24px;
            border-radius: 28px;
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
        }
        .check-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }
        .kw-group {
            margin-bottom: 28px;
        }
        .kw-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            font-size: 14px;
        }
        button {
            background: linear-gradient(105deg, #2563eb, #4f46e5);
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            box-shadow: 0 6px 14px rgba(37,99,235,0.25);
        }
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.02);
        }
        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        .result {
            margin-top: 32px;
            border-top: 1px solid #e2e8f0;
            padding-top: 28px;
        }
        .alert-platform {
            background: #fffbeb;
            border-left: 5px solid #f59e0b;
            padding: 14px 18px;
            border-radius: 20px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #92400e;
        }
        .score-badge {
            display: inline-block;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px,1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .metric {
            background: #f8fafc;
            border-radius: 18px;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
        }
        .metric .label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .metric .value {
            font-size: 18px;
            font-weight: 800;
            margin-top: 6px;
        }
        .analysis {
            background: #fefce8;
            border-radius: 24px;
            padding: 20px 24px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        hr {
            margin: 20px 0;
            border: 0;
            height: 1px;
            background: #e2e8f0;
        }
        .footer-note {
            font-size: 11px;
            text-align: center;
            margin-top: 28px;
            color: #64748b;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>🔍 Аудит сайта — WINNER</h1>
            <p>Вставьте URL, отметьте нужные проверки и получите честный отчёт</p>
        </div>
        <div class="card-body">
            <div class="url-group">
                <label>🌐 Адрес сайта</label>
                <input type="url" id="url" placeholder="https://jubileehub.net" value="https://jubileehub.net">
            </div>

            <div class="checks-grid">
                <label class="check-item"><input type="checkbox" id="chk-seo" checked> 🔍 SEO-теги</label>
                <label class="check-item"><input type="checkbox" id="chk-speed"> ⚡ Скорость</label>
                <label class="check-item"><input type="checkbox" id="chk-security"> 🔒 Безопасность</label>
                <label class="check-item"><input type="checkbox" id="chk-competitors"> 🥊 Конкуренты</label>
            </div>

            <div class="kw-group">
                <label>📌 Ключевое слово (только для конкурентов)</label>
                <input type="text" id="keyword" placeholder="jubilee">
            </div>

            <button id="runBtn">🚀 Запустить аудит</button>

            <div id="resultArea" class="result"></div>
        </div>
    </div>
    <div class="footer-note">⚡ WINNER engine — реальные данные через API. Адаптация под платформу.</div>
</div>

<script>
    const WORKER_URL = 'https://pilot-chat.esem39.workers.dev'; // твой существующий worker

    const runBtn = document.getElementById('runBtn');
    const resultDiv = document.getElementById('resultArea');

    async function fetchAudit(action, url, keyword) {
        const body = { action, url, keyword: keyword || '' };
        const resp = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        return await resp.json();
    }

    async function runFullAudit() {
        const url = document.getElementById('url').value.trim();
        if (!url) {
            alert('Введите URL сайта');
            return;
        }
        const withSEO = document.getElementById('chk-seo').checked;
        const withSpeed = document.getElementById('chk-speed').checked;
        const withSecurity = document.getElementById('chk-security').checked;
        const withCompetitors = document.getElementById('chk-competitors').checked;
        const keyword = document.getElementById('keyword').value.trim();

        if (!withSEO && !withSpeed && !withSecurity && !withCompetitors) {
            alert('Выберите хотя бы один тип проверки');
            return;
        }

        runBtn.disabled = true;
        runBtn.textContent = '⏳ Анализируем...';
        resultDiv.innerHTML = `<div style="text-align:center; padding:40px;">🛰️ Сканируем сайт, подождите...</div>`;

        let seoData = null, speedData = null, securityData = null, competitorsData = null;

        try {
            if (withSEO) seoData = await fetchAudit('seo', url, keyword);
            if (withSpeed) speedData = await fetchAudit('technical', url, '');
            if (withSecurity) securityData = await fetchAudit('security', url, '');
            if (withCompetitors && keyword) competitorsData = await fetchAudit('competitors', url, keyword);
        } catch (err) {
            resultDiv.innerHTML = `<div class="alert-platform" style="background:#fee2e2;">❌ Ошибка: ${err.message}</div>`;
            runBtn.disabled = false;
            runBtn.textContent = '🚀 Запустить аудит';
            return;
        }

        // формируем отчёт
        let html = '';

        // платформа (берём из SEO, если есть, иначе из технического)
        let platformName = '';
        let platformLimitations = [];
        if (seoData && seoData.platformName) {
            platformName = seoData.platformName;
            platformLimitations = seoData.platformLimitations || [];
        } else if (speedData && speedData.platformName) {
            platformName = speedData.platformName;
            platformLimitations = speedData.platformLimitations || [];
        }

        if (platformName) {
            html += `<div class="alert-platform">
                        <strong>⚠️ Платформа: ${platformName}</strong><br>
                        ${platformLimitations.length ? `Ограничения: ${platformLimitations.join(', ')}. Рекомендации адаптированы.` : ''}
                     </div>`;
        }

        // --- SEO ---
        if (withSEO && seoData && !seoData.error) {
            const checks = seoData.checks || {};
            const total = seoData.totalScore || 0;
            const color = total >= 80 ? '#10b981' : (total >= 50 ? '#f59e0b' : '#ef4444');
            html += `<div style="margin-bottom:24px;">
                        <div class="score-badge" style="background:#eef2ff;">🔍 SEO · общая оценка <strong style="color:${color};">${total}</strong></div>
                        <div class="metrics-grid">`;
            for (let [key, c] of Object.entries(checks)) {
                html += `<div class="metric"><div class="label">${c.label}</div><div class="value">${c.score}%</div><div style="font-size:11px; color:#475569;">${c.detail || ''}</div></div>`;
            }
            html += `</div>`;
            if (seoData.h2 && seoData.h2.length) {
                html += `<div style="font-size:13px; margin-top:8px;"><strong>H2:</strong> ${seoData.h2.slice(0,5).join(' · ')}</div>`;
            }
            html += `<div class="analysis">📋 <strong>Анализ и рекомендации</strong><br>${seoData.analysis || '—'}</div>`;
            html += `</div>`;
        } else if (withSEO && seoData?.error) {
            html += `<div class="alert-platform" style="background:#fee2e2;">❌ SEO ошибка: ${seoData.error}</div>`;
        }

        // --- Скорость ---
        if (withSpeed && speedData && !speedData.error) {
            const checks = speedData.checks || {};
            const total = speedData.totalScore || 0;
            html += `<hr><div style="margin:16px 0 8px;"><div class="score-badge" style="background:#eef2ff;">⚡ Скорость · ${total}</div></div>
                     <div class="metrics-grid">`;
            for (let [key, c] of Object.entries(checks)) {
                html += `<div class="metric"><div class="label">${c.label}</div><div class="value">${c.score}%</div><div style="font-size:11px;">${c.detail || ''}</div></div>`;
            }
            html += `</div><div class="analysis">📌 ${speedData.analysis || 'Рекомендации по скорости'}</div>`;
        } else if (withSpeed && speedData?.error) {
            html += `<div class="alert-platform" style="background:#fee2e2;">❌ Ошибка скорости: ${speedData.error}</div>`;
        }

        // --- Безопасность ---
        if (withSecurity && securityData && !securityData.error) {
            const checks = securityData.checks || {};
            const total = securityData.totalScore || 0;
            html += `<hr><div><div class="score-badge" style="background:#eef2ff;">🔒 Безопасность · ${total}</div></div>
                     <div class="metrics-grid">`;
            for (let [key, c] of Object.entries(checks)) {
                html += `<div class="metric"><div class="label">${c.label}</div><div class="value">${c.score}%</div><div style="font-size:11px;">${c.detail || ''}</div></div>`;
            }
            html += `</div><div class="analysis">🛡️ ${securityData.analysis || 'Рекомендации по безопасности'}</div>`;
        } else if (withSecurity && securityData?.error) {
            html += `<div class="alert-platform" style="background:#fee2e2;">❌ Ошибка безопасности: ${securityData.error}</div>`;
        }

        // --- Конкуренты ---
        if (withCompetitors && keyword) {
            if (competitorsData && !competitorsData.error) {
                const results = competitorsData.results || [];
                const ourPos = competitorsData.ourPosition;
                html += `<hr><div><div class="score-badge" style="background:#eef2ff;">🥊 Конкуренты по запросу «${keyword}»</div>`;
                if (ourPos) html += `<div style="margin-bottom:12px;">📍 Наш сайт: позиция #${ourPos}</div>`;
                else html += `<div style="margin-bottom:12px;">📍 Наш сайт не в топ‑10</div>`;
                html += `<div style="display:flex; flex-direction:column; gap:10px;">`;
                for (let i=0; i<Math.min(results.length,8); i++) {
                    const r = results[i];
                    html += `<div style="background:#f8fafc; border-radius:16px; padding:10px 16px; border:1px solid #e2e8f0;">
                                <div style="font-weight:700;">${r.position}. ${r.domain}</div>
                                <div style="font-size:12px; color:#334155;">${r.title?.slice(0,90) || ''}</div>
                             </div>`;
                }
                html += `</div>`;
                if (competitorsData.analysis) {
                    html += `<div class="analysis" style="margin-top:14px;">🧠 ${competitorsData.analysis}</div>`;
                }
            } else {
                html += `<div class="alert-platform" style="background:#fee2e2;">❌ Не удалось получить конкурентов: ${competitorsData?.error || 'ошибка'}</div>`;
            }
        }

        if (!html) {
            html = `<div class="alert-platform">⚠️ Нет данных для выбранных проверок. Попробуйте позже.</div>`;
        }

        resultDiv.innerHTML = html;
        runBtn.disabled = false;
        runBtn.textContent = '🚀 Запустить аудит';
    }

    runBtn.addEventListener('click', runFullAudit);
</script>
</body>
</html>
