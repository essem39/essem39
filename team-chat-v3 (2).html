<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINNER Аудит — как AirFlow Pilot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
            padding: 32px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* главная карточка */
        .card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            padding: 28px 32px 12px 32px;
            border-bottom: 1px solid #e9eef3;
        }

        .card-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .card-header p {
            color: #5b6e8c;
            margin-top: 8px;
            font-size: 14px;
        }

        .card-body {
            padding: 28px 32px;
        }

        /* поля ввода */
        .url-group {
            margin-bottom: 24px;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
            color: #334155;
        }

        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 24px;
            background: #fff;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        .checks-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin: 20px 0 24px;
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: 32px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .check-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        button {
            background: linear-gradient(105deg, #2563eb, #4f46e5);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            color: white;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 6px 12px rgba(37,99,235,0.25);
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.02);
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
        }

        /* результат — как AirFlow Pilot */
        .result {
            margin-top: 32px;
            border-top: 1px solid #e9eef3;
            padding-top: 24px;
        }

        .platform-badge {
            background: #fffbeb;
            border-left: 5px solid #f59e0b;
            border-radius: 20px;
            padding: 12px 20px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #92400e;
        }

        .score-big {
            font-size: 28px;
            font-weight: 800;
            display: inline-block;
            margin-right: 12px;
        }

        /* карточка метрики */
        .metric-card {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid #eef2ff;
            padding: 16px 20px;
            margin-bottom: 14px;
            transition: 0.1s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .metric-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .metric-name {
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .metric-score {
            font-weight: 800;
            font-size: 20px;
        }

        .progress {
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            width: 0%;
        }

        .metric-detail {
            font-size: 12px;
            color: #475569;
            margin-top: 6px;
        }

        .green {
            color: #10b981;
        }
        .yellow {
            color: #f59e0b;
        }
        .red {
            color: #ef4444;
        }

        .bg-green-light {
            background: #ecfdf5;
            border-left: 4px solid #10b981;
        }
        .bg-yellow-light {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
        }
        .bg-red-light {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
        }

        .competitor-item {
            background: #f8fafc;
            border-radius: 20px;
            padding: 12px 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #e2e8f0;
        }

        .competitor-rank {
            font-weight: 800;
            font-size: 18px;
            min-width: 40px;
            color: #2563eb;
        }

        .competitor-domain {
            font-weight: 600;
        }

        hr {
            margin: 24px 0;
            border: 0;
            height: 1px;
            background: #e9eef3;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #6c86a3;
            margin-top: 28px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 24px 0 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>✈️ WINNER Аудит</h1>
            <p>Вставьте URL, выберите проверки — получите отчёт как у AirFlow Pilot</p>
        </div>
        <div class="card-body">
            <div class="url-group">
                <label>🌐 Адрес сайта</label>
                <input type="url" id="url" placeholder="https://jubileehub.net" value="https://jubileehub.net">
            </div>

            <div class="checks-row">
                <label class="check-item"><input type="checkbox" id="chk-seo" checked> 🔍 SEO</label>
                <label class="check-item"><input type="checkbox" id="chk-speed"> ⚡ Скорость</label>
                <label class="check-item"><input type="checkbox" id="chk-security"> 🔒 Безопасность</label>
                <label class="check-item"><input type="checkbox" id="chk-competitors"> 🥊 Конкуренты</label>
            </div>

            <div class="url-group">
                <label>📌 Ключевое слово (для конкурентов)</label>
                <input type="text" id="keyword" placeholder="jubilee">
            </div>

            <button id="runBtn">🚀 Запустить аудит</button>

            <div id="resultArea" class="result"></div>
        </div>
    </div>
    <div class="footer-note">⚡ WINNER — каждый пункт с цветом, коротко и ясно</div>
</div>

<script>
    const WORKER = 'https://pilot-chat.esem39.workers.dev';

    async function fetchAction(action, url, keyword) {
        const body = { action, url, keyword: keyword || '' };
        const resp = await fetch(WORKER, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        return resp.json();
    }

    function getColorClass(score) {
        if (score >= 80) return 'green';
        if (score >= 50) return 'yellow';
        return 'red';
    }

    function getBgClass(score) {
        if (score >= 80) return 'bg-green-light';
        if (score >= 50) return 'bg-yellow-light';
        return 'bg-red-light';
    }

    function renderMetric(c) {
        const color = getColorClass(c.score);
        const bgClass = getBgClass(c.score);
        return `
            <div class="metric-card ${bgClass}">
                <div class="metric-header">
                    <div class="metric-name">${c.label}</div>
                    <div class="metric-score ${color}">${c.score}%</div>
                </div>
                <div class="progress"><div class="progress-fill ${color}" style="width:${c.score}%; background:${c.score>=80?'#10b981':c.score>=50?'#f59e0b':'#ef4444'}"></div></div>
                <div class="metric-detail">${c.detail || ''}</div>
            </div>
        `;
    }

    async function runAudit() {
        const url = document.getElementById('url').value.trim();
        if (!url) { alert('Введите URL'); return; }
        const withSEO = document.getElementById('chk-seo').checked;
        const withSpeed = document.getElementById('chk-speed').checked;
        const withSecurity = document.getElementById('chk-security').checked;
        const withCompetitors = document.getElementById('chk-competitors').checked;
        const keyword = document.getElementById('keyword').value.trim();

        if (!withSEO && !withSpeed && !withSecurity && !withCompetitors) {
            alert('Выберите хотя бы одну проверку');
            return;
        }

        const runBtn = document.getElementById('runBtn');
        runBtn.disabled = true;
        runBtn.textContent = '⏳ Сканируем...';
        const resultDiv = document.getElementById('resultArea');
        resultDiv.innerHTML = '<div style="text-align:center; padding:40px;">🛰️ Анализируем сайт...</div>';

        let seo = null, speed = null, security = null, competitors = null;
        try {
            if (withSEO) seo = await fetchAction('seo', url, keyword);
            if (withSpeed) speed = await fetchAction('technical', url, '');
            if (withSecurity) security = await fetchAction('security', url, '');
            if (withCompetitors && keyword) competitors = await fetchAction('competitors', url, keyword);
        } catch(e) {
            resultDiv.innerHTML = `<div class="platform-badge" style="background:#fee2e2;">❌ Ошибка соединения: ${e.message}</div>`;
            runBtn.disabled = false;
            runBtn.textContent = '🚀 Запустить аудит';
            return;
        }

        let html = '';

        // Платформа
        let platformName = seo?.platformName || speed?.platformName || security?.platformName;
        let limitations = seo?.platformLimitations || speed?.platformLimitations || security?.platformLimitations || [];
        if (platformName) {
            html += `<div class="platform-badge">
                        <strong>⚠️ Платформа: ${platformName}</strong><br>
                        ${limitations.length ? `Ограничения: ${limitations.slice(0,3).join(', ')}` : ''}
                     </div>`;
        }

        // SEO
        if (withSEO && seo && !seo.error) {
            html += `<div class="section-title">🔍 SEO · общая оценка <span class="score-big ${getColorClass(seo.totalScore)}">${seo.totalScore}</span></div>`;
            for (let [k, c] of Object.entries(seo.checks || {})) {
                html += renderMetric(c);
            }
            if (seo.analysis) {
                html += `<div class="metric-card bg-yellow-light" style="margin-top:8px;"><div class="metric-name">📌 Рекомендации</div><div class="metric-detail">${seo.analysis.substring(0,350)}${seo.analysis.length>350?'…':''}</div></div>`;
            }
        } else if (withSEO && seo?.error) {
            html += `<div class="platform-badge" style="background:#fee2e2;">❌ SEO ошибка: ${seo.error}</div>`;
        }

        // Скорость
        if (withSpeed && speed && !speed.error) {
            html += `<hr><div class="section-title">⚡ Скорость · общая оценка <span class="score-big ${getColorClass(speed.totalScore)}">${speed.totalScore}</span></div>`;
            for (let [k, c] of Object.entries(speed.checks || {})) {
                html += renderMetric(c);
            }
            if (speed.analysis) html += `<div class="metric-card bg-yellow-light"><div class="metric-name">💡 Совет</div><div class="metric-detail">${speed.analysis.substring(0,300)}</div></div>`;
        } else if (withSpeed && speed?.error) {
            html += `<div class="platform-badge" style="background:#fee2e2;">❌ Ошибка скорости: ${speed.error}</div>`;
        }

        // Безопасность
        if (withSecurity && security && !security.error) {
            html += `<hr><div class="section-title">🔒 Безопасность · общая оценка <span class="score-big ${getColorClass(security.totalScore)}">${security.totalScore}</span></div>`;
            for (let [k, c] of Object.entries(security.checks || {})) {
                html += renderMetric(c);
            }
            if (security.analysis) html += `<div class="metric-card bg-yellow-light"><div class="metric-name">🛡️ Рекомендации</div><div class="metric-detail">${security.analysis.substring(0,300)}</div></div>`;
        } else if (withSecurity && security?.error) {
            html += `<div class="platform-badge" style="background:#fee2e2;">❌ Ошибка безопасности: ${security.error}</div>`;
        }

        // Конкуренты
        if (withCompetitors && keyword && competitors && !competitors.error) {
            html += `<hr><div class="section-title">🥊 Конкуренты по запросу «${keyword}»</div>`;
            if (competitors.ourPosition) html += `<div class="metric-card bg-green-light"><div class="metric-name">📍 Наш сайт</div><div class="metric-detail">Позиция #${competitors.ourPosition} в топ‑10</div></div>`;
            else html += `<div class="metric-card bg-yellow-light"><div class="metric-name">📍 Наш сайт</div><div class="metric-detail">Не в топ‑10</div></div>`;
            const results = competitors.results || [];
            for (let i=0; i<Math.min(results.length, 7); i++) {
                const r = results[i];
                html += `<div class="competitor-item">
                            <div class="competitor-rank">#${r.position}</div>
                            <div><div class="competitor-domain">${r.domain}</div><div style="font-size:12px; color:#475569;">${r.title?.slice(0,70) || ''}</div></div>
                         </div>`;
            }
            if (competitors.analysis) {
                html += `<div class="metric-card bg-yellow-light"><div class="metric-name">🧠 Стратегия</div><div class="metric-detail">${competitors.analysis.substring(0,250)}</div></div>`;
            }
        } else if (withCompetitors && keyword && competitors?.error) {
            html += `<div class="platform-badge" style="background:#fee2e2;">❌ Конкуренты: ${competitors.error}</div>`;
        }

        if (!html) html = `<div class="platform-badge">⚠️ Нет данных. Попробуйте позже.</div>`;
        resultDiv.innerHTML = html;
        runBtn.disabled = false;
        runBtn.textContent = '🚀 Запустить аудит';
    }

    document.getElementById('runBtn').addEventListener('click', runAudit);
</script>
</body>
</html>
