<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINNER Аудит — честные инструкции</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f0f4f9; font-family: 'Segoe UI', system-ui, sans-serif; padding: 32px 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1); margin-bottom: 32px; }
        .card-header { padding: 28px 32px 12px 32px; border-bottom: 1px solid #e9edf2; }
        .card-header h1 { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #1e3a8a, #3b82f6); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .card-body { padding: 28px 32px; }
        .input-group { margin-bottom: 20px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; color: #2c3e66; }
        input { width: 100%; padding: 12px 18px; border-radius: 60px; border: 1px solid #cbd5e1; font-size: 15px; }
        .checks-flex { display: flex; flex-wrap: wrap; gap: 28px; background: #f8fafc; padding: 16px 24px; border-radius: 60px; margin: 16px 0; }
        .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        button.primary { background: linear-gradient(105deg, #1e3a8a, #2563eb); border: none; padding: 12px 24px; border-radius: 40px; font-weight: 700; font-size: 16px; color: white; width: 100%; cursor: pointer; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; margin-top: 28px; }
        .metric-card { background: white; border-radius: 24px; border: 1px solid #e2edf7; overflow: hidden; }
        .metric-header { padding: 18px 20px 8px 20px; display: flex; justify-content: space-between; align-items: baseline; }
        .metric-title { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; }
        .metric-score { font-size: 28px; font-weight: 800; }
        .progress { padding: 0 20px; margin-bottom: 12px; }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 10px; width: 0%; }
        .metric-detail { padding: 0 20px 12px 20px; font-size: 13px; color: #2d4a6e; }
        .btn-fix { background: #f0f4fa; border: none; width: calc(100% - 40px); margin: 0 20px 18px 20px; padding: 10px; border-radius: 40px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .spoiler { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: #fefce8; border-top: 1px solid #fde68a; padding: 0 20px; }
        .spoiler.show { max-height: 800px; padding: 16px 20px 20px 20px; }
        .instruction-step { margin-bottom: 12px; font-size: 13px; white-space: pre-line; }
        .platform-badge { background: #fffbeb; border-left: 5px solid #f59e0b; padding: 12px 20px; border-radius: 24px; margin-bottom: 24px; }
        .green-bg { background: #ecfdf5; border-left-color: #10b981; }
        .section-title { font-size: 22px; font-weight: 700; margin: 32px 0 16px 0; display: flex; gap: 12px; align-items: center; }
        .missing-img-list { font-size: 12px; margin-top: 8px; color: #b45309; word-break: break-all; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1><i class="fas fa-chart-line"></i> WINNER Аудит</h1>
            <p>Выберите проверки, получите отчёт с инструкциями по шагам</p>
        </div>
        <div class="card-body">
            <div class="input-group">
                <label>🌐 URL сайта</label>
                <input type="url" id="siteUrl" placeholder="https://gisher.me" value="https://gisher.me">
            </div>
            <div class="checks-flex">
                <label class="check"><input type="checkbox" id="chkSeo" checked> 🔍 SEO</label>
                <label class="check"><input type="checkbox" id="chkSpeed"> ⚡ Скорость</label>
                <label class="check"><input type="checkbox" id="chkSecurity"> 🔒 Безопасность</label>
                <label class="check"><input type="checkbox" id="chkCompetitors"> 🥊 Конкуренты</label>
            </div>
            <div class="input-group">
                <label>📌 Ключевое слово (для конкурентов)</label>
                <input type="text" id="keyword" placeholder="jubilee">
            </div>
            <button class="primary" id="runBtn"><i class="fas fa-rocket"></i> Запустить аудит</button>
        </div>
    </div>
    <div id="resultsArea"></div>
</div>

<script>
    const WORKER_URL = 'https://pilot-chat.esem39.workers.dev'; // замени на свой URL

    async function callWorker(action, url, keyword) {
        const resp = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, url, keyword: keyword || '' })
        });
        return await resp.json();
    }

    function getColorByScore(score) {
        if (score >= 80) return '#10b981';
        if (score >= 50) return '#f59e0b';
        return '#ef4444';
    }

    function renderMetric(metric, key, extra = {}) {
        const score = metric.score;
        const color = getColorByScore(score);
        let statusText = '';
        if (score === 100) statusText = '✅ Отлично, исправлять не нужно';
        else if (score >= 80) statusText = '✅ Хорошо, но можно улучшить';
        else if (score >= 50) statusText = '⚠️ Внимание, требуется доработка';
        else statusText = '❌ Плохо, срочно исправляйте';

        let detailHtml = metric.detail || '';
        if (key === 'alts' && extra.missingAltUrls && extra.missingAltUrls.length) {
            detailHtml += `<div class="missing-img-list"><i class="fas fa-image"></i> <strong>Картинки без ALT:</strong><br>${extra.missingAltUrls.slice(0,10).map(u => `• ${u}`).join('<br>')}</div>`;
        }

        return `
            <div class="metric-card">
                <div class="metric-header">
                    <div class="metric-title"><i class="fas fa-chart-simple"></i> ${metric.label}</div>
                    <div class="metric-score" style="color:${color}">${score}%</div>
                </div>
                <div class="progress"><div class="progress-bar"><div class="progress-fill" style="width:${score}%; background:${color}"></div></div></div>
                <div class="metric-detail">${detailHtml}</div>
                <div class="metric-detail" style="font-weight:500;">${statusText}</div>
                <button class="btn-fix" data-key="${key}" data-score="${score}"><span><i class="fas fa-tools"></i> Как исправить?</span> <i class="fas fa-chevron-down"></i></button>
                <div class="spoiler" id="spoiler-${key}">
                    <div class="instruction-step">Загрузка инструкции...</div>
                </div>
            </div>
        `;
    }

    async function runAudit() {
        const url = document.getElementById('siteUrl').value.trim();
        if (!url) { alert('Введите URL'); return; }
        const withSeo = document.getElementById('chkSeo').checked;

        const btn = document.getElementById('runBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Анализирую...';
        const resultsDiv = document.getElementById('resultsArea');
        resultsDiv.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fas fa-microchip"></i> Сканирование...</div>';

        let seo = null;
        try {
            if (withSeo) seo = await callWorker('seo', url, '');
        } catch(e) {
            resultsDiv.innerHTML = `<div class="platform-badge" style="background:#fee2e2;">❌ Ошибка: ${e.message}</div>`;
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-rocket"></i> Запустить аудит';
            return;
        }

        let html = '';
        if (seo && !seo.error) {
            if (seo.platformName) {
                html += `<div class="platform-badge"><i class="fas fa-cube"></i> <strong>Платформа: ${seo.platformName}</strong><br>${(seo.platformLimitations || []).slice(0,2).join(', ')}</div>`;
            }
            html += `<div class="section-title"><i class="fas fa-search"></i> SEO-анализ</div><div class="result-grid">`;
            for (let [key, metric] of Object.entries(seo.checks || {})) {
                const extra = (key === 'alts' && seo.missingAltUrls) ? { missingAltUrls: seo.missingAltUrls } : {};
                html += renderMetric(metric, key, extra);
            }
            html += `</div>`;
            if (seo.analysis) {
                html += `<div class="platform-badge green-bg"><i class="fas fa-robot"></i> AI-рекомендации: ${seo.analysis}</div>`;
            }
        } else {
            html = `<div class="platform-badge" style="background:#fee2e2;">Не удалось получить данные</div>`;
        }

        resultsDiv.innerHTML = html;

        // Подключаем кнопки и загружаем инструкции через отдельный вызов fix
        document.querySelectorAll('.btn-fix').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const key = btn.getAttribute('data-key');
                const spoiler = document.getElementById(`spoiler-${key}`);
                if (!spoiler) return;
                if (spoiler.classList.contains('show')) {
                    spoiler.classList.remove('show');
                    return;
                }
                spoiler.classList.add('show');
                if (spoiler.innerHTML.includes('Загрузка инструкции')) {
                    spoiler.innerHTML = '<div class="instruction-step">📡 Получаю инструкцию...</div>';
                    try {
                        const platform = seo?.platformName || 'Кастомный хостинг';
                        const fixRes = await fetch(WORKER_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'fix', issue: key, fixUrl: url, platform })
                        });
                        const fixData = await fixRes.json();
                        const instruction = fixData.fix || 'Инструкция временно недоступна.';
                        spoiler.innerHTML = `<div class="instruction-step">${instruction.replace(/\n/g, '<br>')}</div>`;
                    } catch(err) {
                        spoiler.innerHTML = `<div class="instruction-step">❌ Ошибка загрузки инструкции</div>`;
                    }
                }
            });
        });

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-rocket"></i> Запустить аудит';
    }

    document.getElementById('runBtn').addEventListener('click', runAudit);
</script>
</body>
</html>
