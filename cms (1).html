<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Control Panel v3 — essem39</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');
:root{--bg:#f0f2f8;--surface:#ffffff;--border:#e2e8f0;--accent:#6c63ff;--text:#1a1a2e;--muted:#64748b;--success:#3ecf8e;--warning:#f59e0b;--error:#ef4444;--mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:44px;}
/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 50%,#ddd8ff 0%,#f0f2f8 70%);}
.login-box{width:440px;padding:48px;background:var(--surface);border:1px solid var(--border);border-radius:4px;}
.login-box h1{font-size:22px;font-weight:800;margin-bottom:4px;}
.login-version{font-size:11px;color:var(--accent);font-family:var(--mono);margin-bottom:32px;}
.field-group{margin-bottom:18px;}
.field-group label{display:block;font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.field-group input,.field-group select,.field-group textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:var(--mono);font-size:13px;padding:10px 14px;outline:none;transition:border-color 0.2s;}
.field-group input:focus,.field-group select:focus,.field-group textarea:focus{border-color:var(--accent);}
.field-group textarea{resize:vertical;min-height:80px;line-height:1.6;}
.field-group select option{background:#ffffff;color:#1a1a2e;}
.hint{font-size:11px;font-family:var(--mono);color:var(--muted);margin-top:5px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:2px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.btn-primary{background:var(--accent);color:#fff;width:100%;justify-content:center;padding:12px;font-size:14px;}
.btn-primary:hover{background:#7c74ff;}
.btn-success{background:var(--success);color:#000;}
.btn-success:hover{background:#4edfae;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:transparent;color:var(--error);border:1px solid var(--error);}
.btn-danger:hover{background:var(--error);color:#fff;}
.btn-sm{padding:6px 14px;font-size:12px;}
.error-msg{color:var(--error);font-size:12px;font-family:var(--mono);margin-top:12px;display:none;}
/* LAYOUT */
#app{display:none;flex-direction:column;min-height:100vh;}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;}
.header-logo{font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px;}
.header-logo span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:12px;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);}
.status-text{font-size:11px;font-family:var(--mono);color:var(--muted);}
.layout{display:flex;flex:1;}
.sidebar{width:230px;min-height:calc(100vh - 56px);background:var(--surface);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;overflow-y:auto;}
.sidebar-section{padding:0 12px;margin-bottom:18px;}
.sidebar-label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:0 4px;margin-bottom:7px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:4px;cursor:pointer;transition:all 0.15s;margin-bottom:2px;font-size:13px;color:var(--muted);border:1px solid transparent;}
.nav-item:hover{background:var(--border);color:var(--text);}
.nav-item.active{background:rgba(108,99,255,0.12);color:var(--accent);border-color:rgba(108,99,255,0.25);}
.site-icon{width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.nav-label{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.main{flex:1;padding:28px 32px;overflow-y:auto;}
/* PAGE HEADER */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.page-subtitle{font-size:12px;font-family:var(--mono);color:var(--muted);margin-top:3px;}
/* TABS */
.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:22px;border-bottom:1px solid var(--border);}
.tab{padding:7px 16px;font-size:11px;font-family:var(--mono);cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-content{display:none;}
.tab-content.active{display:block;}
/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:22px;margin-bottom:14px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.card-title{font-size:14px;font-weight:700;}
/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:16px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;}
.stat-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.stat-card .open-link{position:absolute;top:8px;right:8px;font-size:11px;color:var(--muted);text-decoration:none;}
.stat-card .open-link:hover{color:var(--accent);}
.stat-icon{font-size:26px;margin-bottom:7px;}
.stat-name{font-size:11px;font-weight:700;margin-bottom:4px;}
.stat-num{font-size:20px;font-weight:800;font-family:var(--mono);color:var(--accent);}
.stat-lbl{font-size:10px;color:var(--muted);font-family:var(--mono);}
.activity-bars{display:flex;align-items:flex-end;gap:3px;height:28px;margin-top:7px;justify-content:center;}
.activity-bar{width:5px;background:var(--border);border-radius:2px;min-height:3px;}
.activity-bar.has{background:var(--accent);opacity:0.7;}
.quick-links{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px;}
.quick-link{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:12px;text-decoration:none;color:var(--text);transition:all 0.15s;display:flex;align-items:center;gap:10px;}
.quick-link:hover{border-color:var(--accent);}
.quick-link .licon{font-size:20px;}
.quick-link .lname{font-size:12px;font-weight:700;}
.quick-link .lurl{font-size:10px;color:var(--muted);font-family:var(--mono);}
/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr;}
.form-grid.g1{grid-template-columns:1fr;}
.span-2{grid-column:span 2;}
.span-3{grid-column:span 3;}
/* ITEMS */
.item-row{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;}
.item-row.center{align-items:center;}
.del-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:3px;transition:color 0.15s;line-height:1;flex-shrink:0;}
.del-btn:hover{color:var(--error);}
.review-stars{color:var(--warning);font-size:13px;white-space:nowrap;}
.price-val{font-family:var(--mono);font-size:14px;color:var(--success);font-weight:700;}
.star-row{display:flex;gap:4px;}
.star-row span{font-size:20px;cursor:pointer;color:var(--muted);transition:color 0.1s;}
.star-row span.on{color:var(--warning);}
/* MISC */
.badge{display:inline-block;padding:2px 8px;border-radius:2px;font-size:10px;font-family:var(--mono);font-weight:600;letter-spacing:0.5px;}
.badge-accent{background:rgba(108,99,255,0.2);color:var(--accent);}
.badge-success{background:rgba(62,207,142,0.15);color:var(--success);}
.badge-warn{background:rgba(245,158,11,0.15);color:var(--warning);}
.divider{height:1px;background:var(--border);margin:18px 0;}
.info-box{background:rgba(108,99,255,0.08);border:1px solid rgba(108,99,255,0.2);border-radius:4px;padding:11px 14px;font-size:12px;font-family:var(--mono);color:#aaa;margin-bottom:18px;line-height:1.6;}
.info-box strong{color:var(--accent);}
.warn-box{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:4px;padding:11px 14px;font-size:12px;font-family:var(--mono);color:#ccc;margin-bottom:18px;line-height:1.6;}
.warn-box strong{color:var(--warning);}
.schema-preview{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:14px;font-family:var(--mono);font-size:11px;color:#888;max-height:280px;overflow-y:auto;white-space:pre;line-height:1.6;}
.loading{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.skeleton{background:linear-gradient(90deg,var(--border) 25%,#2a2a3e 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
/* PAGE EDITOR */
.pages-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.page-row{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all 0.15s;}
.page-row:hover{border-color:var(--accent);}
.page-row.selected{border-color:var(--accent);background:rgba(108,99,255,0.08);}
.page-row .pname{font-family:var(--mono);font-size:12px;}
.editable-fields{display:flex;flex-direction:column;gap:12px;}
.edit-field{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:14px;}
.edit-field-label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.edit-field input,.edit-field textarea{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;resize:vertical;line-height:1.6;}
.edit-field textarea{min-height:60px;}
/* MENU EDITOR */
.menu-item-row{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.menu-drag{cursor:grab;color:var(--muted);font-size:16px;}
.menu-item-row input{background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;flex:1;}
/* BLOG */
.blog-post-row{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.post-title-text{font-size:13px;font-weight:600;}
.post-meta{font-size:11px;font-family:var(--mono);color:var(--muted);margin-top:3px;}
/* PROMO */
.promo-row{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.promo-code{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--warning);background:rgba(245,158,11,0.1);padding:4px 10px;border-radius:2px;border:1px solid rgba(245,158,11,0.3);}
/* CHANGELOG */
.clog-item{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:11px 14px;margin-bottom:7px;display:flex;align-items:flex-start;gap:12px;}
.clog-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.clog-time{font-size:11px;font-family:var(--mono);color:var(--muted);white-space:nowrap;}
.clog-what{font-size:13px;font-weight:600;}
.clog-where{font-size:11px;font-family:var(--mono);color:var(--muted);margin-top:2px;}
/* TOAST + LOG */
.toast-container{position:fixed;bottom:50px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999;}
.toast{padding:11px 18px;border-radius:4px;font-size:13px;font-family:var(--mono);display:flex;align-items:center;gap:10px;animation:slideIn 0.2s ease;max-width:400px;}
.toast-success{background:var(--success);color:#000;}
.toast-error{background:var(--error);color:#fff;}
.toast-info{background:var(--accent);color:#fff;}
@keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
#log-panel{position:fixed;bottom:0;left:0;right:0;background:#0d0d14;border-top:1px solid var(--border);padding:6px 20px;z-index:9998;display:flex;align-items:center;gap:16px;height:32px;}
#log-label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1px;white-space:nowrap;}
#action-log{font-size:11px;font-family:var(--mono);color:var(--text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>CMS Control Panel</h1>
    <p class="login-version">essem39 · v3.0 · полное управление сайтами</p>
    <div class="field-group">
      <label>Пароль</label>
      <input type="password" id="login-pass" placeholder="••••••••" />
    </div>
    <div class="field-group">
      <label>GitHub Token</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxx" />
      <p class="hint" style="margin-top:5px;">Settings → Developer settings → Tokens (classic) → repo scope</p>
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Войти в панель</button>
    <p class="error-msg" id="login-error"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-logo">⬡ <span>CMS</span> Control Panel <span style="font-size:10px;color:var(--muted);font-family:var(--mono);margin-left:6px;">v3.0</span></div>
    <div class="header-right">
      <div class="status-dot"></div>
      <span class="status-text">GitHub API · essem39</span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Выйти</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Обзор</div>
        <div class="nav-item active" id="nav-dashboard" onclick="showDashboard()"><span>📊</span><span class="nav-label">Дашборд</span></div>
        <div class="nav-item" id="nav-changelog" onclick="showChangelog()"><span>🕐</span><span class="nav-label">История изменений</span></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label" style="display:flex;align-items:center;justify-content:space-between;">
          <span>Сайты</span>
          <span onclick="showAddSite()" title="Добавить сайт" style="cursor:pointer;color:var(--accent);font-size:18px;line-height:1;padding:0 4px;">+</span>
        </div>
        <div id="site-list"></div>
      </div>
    </div>
    <div class="main" id="main-content">
      <div style="display:flex;align-items:center;gap:12px;color:var(--muted);font-family:var(--mono);font-size:13px;"><div class="loading"></div> Загрузка...</div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<!-- МОДАЛЬНОЕ ОКНО — ДОБАВИТЬ САЙТ -->
<div id="add-site-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;width:380px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,0.15);">
    <div style="font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:20px;">➕ Добавить сайт</div>
    <label style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Название</label>
    <input id="new-site-name" type="text" placeholder="WiseTools" style="width:100%;margin:6px 0 14px;padding:9px 12px;background:#f0f2f8;border:1px solid #e2e8f0;border-radius:6px;color:#1a1a2e;font-size:14px;outline:none;">
    <label style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">GitHub Репо</label>
    <input id="new-site-repo" type="text" placeholder="essem39/wisetools" style="width:100%;margin:6px 0 14px;padding:9px 12px;background:#f0f2f8;border:1px solid #e2e8f0;border-radius:6px;color:#1a1a2e;font-size:14px;outline:none;">
    <label style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">URL сайта</label>
    <input id="new-site-url" type="text" placeholder="https://wisetools.org/" style="width:100%;margin:6px 0 14px;padding:9px 12px;background:#f0f2f8;border:1px solid #e2e8f0;border-radius:6px;color:#1a1a2e;font-size:14px;outline:none;">
    <label style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Иконка (эмодзи)</label>
    <input id="new-site-icon" type="text" placeholder="🌐" maxlength="2" style="width:100%;margin:6px 0 20px;padding:9px 12px;background:#f0f2f8;border:1px solid #e2e8f0;border-radius:6px;color:#1a1a2e;font-size:20px;outline:none;">
    <div style="display:flex;gap:10px;">
      <button onclick="addSite()" style="flex:1;padding:10px;background:#6c63ff;color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;">✅ Добавить</button>
      <button onclick="hideAddSite()" style="flex:1;padding:10px;background:#f0f2f8;color:#1a1a2e;border:1px solid #e2e8f0;border-radius:7px;font-size:14px;cursor:pointer;">Отмена</button>
    </div>
  </div>
</div>
<div id="log-panel"><span id="log-label">ЛОГ</span><span id="action-log">готов к работе</span></div>

<script>
// ═══════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════
const ADMIN_PASSWORD = 'essem2024';

const DEFAULT_SITES = [
  {id:'airflow', name:'AirFlowTravel', repo:'essem39/Airflow', icon:'✈️', color:'#6c63ff', schemaType:'TravelAgency', siteUrl:'https://airflowtravel.net/'},
  {id:'coffee',  name:'Coffee',        repo:'essem39/coffee-analysis', icon:'☕', color:'#c97c3a', schemaType:'Store', siteUrl:'https://coffeespecialty.ru/'},
  {id:'elama',   name:'eLama',         repo:'essem39/eLama', icon:'🦙', color:'#3ecf8e', schemaType:'SoftwareApplication', siteUrl:'https://essem39.github.io/eLama/'},
  {id:'alidrop', name:'AliDrop',       repo:'essem39/alidropinfo', icon:'📦', color:'#ff6584', schemaType:'SoftwareApplication', siteUrl:'https://essem39.github.io/alidropinfo/'},
  {id:'wisetools',name:'WiseTools',    repo:'essem39/wisetools', icon:'💳', color:'#00b950', schemaType:'WebSite', siteUrl:'https://wisetools.org/'},
  {id:'storelines',name:'StoreLines',  repo:'essem39/storelines', icon:'🚗', color:'#E8232A', schemaType:'WebSite', siteUrl:'https://storelines.net/'},
  {id:'cryptocardpro',name:'CryptoCardPro', repo:'essem39/cryptocardpro', icon:'💳', color:'#f59e0b', schemaType:'WebSite', siteUrl:'https://cryptocardpro.com/'},
  {id:'shopify', name:'Shopify Guide', repo:'essem39/shopify-dropshipping-guide', icon:'🛍️', color:'#96bf48', schemaType:'WebSite', siteUrl:'https://essem39.github.io/shopify-dropshipping-guide/'}
];

function loadSites(){
  const custom = JSON.parse(localStorage.getItem('cms_custom_sites')||'[]');
  const hidden = JSON.parse(localStorage.getItem('cms_hidden_sites')||'[]');
  const defaults = DEFAULT_SITES.filter(s=>!hidden.includes(s.id));
  return [...defaults, ...custom];
}

function saveSites(custom){
  localStorage.setItem('cms_custom_sites', JSON.stringify(custom));
}

function getCustomSites(){
  return JSON.parse(localStorage.getItem('cms_custom_sites')||'[]');
}

let SITES = loadSites();

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let ghToken='', currentSite=null, siteData={}, repoFiles={};
let changelog = JSON.parse(localStorage.getItem('cms_changelog')||'[]');
let selectedPageFile = null;

// ═══════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════
function doLogin(){
  const pass=document.getElementById('login-pass').value;
  const token=document.getElementById('gh-token').value.trim();
  if(pass!==ADMIN_PASSWORD){showErr('Неверный пароль');return;}
  if(!token){showErr('Введи GitHub Token');return;}
  ghToken=token;

function addSite(){
  const name = document.getElementById('new-site-name').value.trim();
  let repo = document.getElementById('new-site-repo').value.trim();
  // Автоочистка: убираем https://github.com/ если вставили полную ссылку
  repo = repo.replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '');
  const url  = document.getElementById('new-site-url').value.trim();
  const icon = document.getElementById('new-site-icon').value.trim()||'🌐';
  if(!name||!repo||!url){alert('Заполни все поля!');return;}
  const id = name.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now();
  const colors=['#6c63ff','#00b950','#E8232A','#c97c3a','#3ecf8e','#ff6584','#0ea5e9'];
  const color = colors[Math.floor(Math.random()*colors.length)];
  const custom = getCustomSites();
  custom.push({id, name, repo, icon, color, schemaType:'WebSite', siteUrl:url});
  saveSites(custom);
  renderSiteList();
  hideAddSite();
  showToast(`✅ Сайт "${name}" добавлен!`);
}

function deleteSite(e, id){
  e.stopPropagation();
  if(!confirm('Удалить этот сайт из CMS?')) return;
  // Удаляем из кастомных если там есть
  const custom = getCustomSites().filter(s=>s.id!==id);
  saveSites(custom);
  // Добавляем в скрытые (для стандартных)
  const hidden = JSON.parse(localStorage.getItem('cms_hidden_sites')||'[]');
  if(!hidden.includes(id)) hidden.push(id);
  localStorage.setItem('cms_hidden_sites', JSON.stringify(hidden));
  renderSiteList();
  showToast('🗑️ Сайт удалён');
}

// GITHUB API
// ═══════════════════════════════════════════════════
async function ghFetch(path,opts={}){
  try{
    const r=await fetch(`https://api.github.com/${path}`,{
      headers:{'Authorization':`token ${ghToken}`,'Accept':'application/vnd.github.v3+json'},
      ...opts
    });
    if(!r.ok)return null;
    return r.json();
  }catch(e){return null;}
}
async function ghGetFile(repo,path){return ghFetch(`repos/${repo}/contents/${encodeURIComponent(path)}`);}
async function ghPutFile(repo,path,content,message,sha){
  const body={message,content:btoa(unescape(encodeURIComponent(content)))};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${repo}/contents/${encodeURIComponent(path)}`,{
    method:'PUT',
    headers:{'Authorization':`token ${ghToken}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  return r.ok?r.json():null;
}
async function ghDeleteFile(repo,path,sha,message){
  const r=await fetch(`https://api.github.com/repos/${repo}/contents/${encodeURIComponent(path)}`,{
    method:'DELETE',
    headers:{'Authorization':`token ${ghToken}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({message,sha})
  });
  return r.ok;
}

function decodeB64(str){return decodeURIComponent(escape(atob(str.replace(/\n/g,''))));}
function encodeB64(str){return btoa(unescape(encodeURIComponent(str)));}

async function loadStats(site){
  try{
    const [commits,activity]=await Promise.all([
      ghFetch(`repos/${site.repo}/commits?per_page=100`),
      ghFetch(`repos/${site.repo}/stats/commit_activity`)
    ]);
    const n=Array.isArray(commits)?commits.length:'?';
    const el=document.getElementById('stat-'+site.id);
    if(el){el.className='stat-num';el.textContent=n===100?'100+':n;}
    const bars=document.getElementById('bars-'+site.id);
    if(bars&&Array.isArray(activity)){
      const last7=activity.slice(-7);
      const mx=Math.max(...last7.map(w=>w.total),1);
      bars.innerHTML=last7.map(w=>{
        const h=Math.max(3,Math.round((w.total/mx)*28));
        return`<div class="activity-bar${w.total>0?' has':''}" style="height:${h}px;" title="${w.total} коммитов"></div>`;
      }).join('');
    }
  }catch(e){}
}

async function selectSite(id){
  currentSite=SITES.find(s=>s.id===id);
  setActive(id);
  selectedPageFile=null;
  document.getElementById('main-content').innerHTML='<div style="display:flex;align-items:center;gap:12px;color:var(--muted);font-family:var(--mono);font-size:13px;"><div class="loading"></div> Загружаем данные сайта...</div>';
  await loadSiteData(currentSite);
  await loadRepoFiles(currentSite);
  renderSitePanel(currentSite);
}

async function loadSiteData(site){
  if(siteData[site.id])return;
  const file=await ghGetFile(site.repo,'cms-data.json');
  if(file){
    try{siteData[site.id]=JSON.parse(decodeB64(file.content));siteData[site.id]._sha=file.sha;}
    catch(e){siteData[site.id]=defData(site);}
  }else{siteData[site.id]=defData(site);}
}

function defData(site){
  return{reviews:[],prices:[],promos:[],blogPosts:[],menu:[],description:'',siteName:site.name,siteUrl:site.siteUrl,_sha:null};
}

async function loadRepoFiles(site){
  const contents=await ghFetch(`repos/${site.repo}/contents`);
  if(!Array.isArray(contents)){repoFiles[site.id]=[];return;}
  // Корневые HTML файлы
  let allFiles = contents.filter(f=>f.name.endsWith('.html')&&f.type==='file');
  // Подпапки — ищем index.html внутри каждой
  const dirs = contents.filter(f=>f.type==='dir'&&!f.name.startsWith('.'));
  await Promise.all(dirs.map(async dir=>{
    try{
      const sub=await ghFetch(`repos/${site.repo}/contents/${dir.name}`);
      if(Array.isArray(sub)){
        sub.filter(f=>f.name.endsWith('.html')&&f.type==='file')
           .forEach(f=>allFiles.push({...f, name:`${dir.name}/${f.name}`}));
      }
    }catch(e){}
  }));
  repoFiles[site.id]=allFiles;
}

function getHtmlFiles(siteId){
  return(repoFiles[siteId]||[]).filter(f=>f.name.endsWith('.html')&&f.type==='file');
}

async function loadSeoPage(siteId){
  const fname=document.getElementById('seo-file-select').value;
  if(!fname)return;
  setLog(`Загружаем ${fname}...`);
  const file=await ghGetFile(SITES.find(s=>s.id===siteId).repo,fname);
  if(!file){toast('Не удалось загрузить файл','error');return;}
  const html=decodeB64(file.content);
  window._seoFile={name:fname,sha:file.sha,html};
  // Extract
  const getM=(html,name)=>{const m=html.match(new RegExp(`<meta[^>]+name=["']${name}["'][^>]+content=["']([^"']*?)["']`,'i'));return m?m[1]:'';}
  const getP=(html,prop)=>{const m=html.match(new RegExp(`<meta[^>]+property=["']${prop}["'][^>]+content=["']([^"']*?)["']`,'i'));return m?m[1]:'';}
  const titleM=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  document.getElementById('seo-title').value=titleM?titleM[1].trim():'';
  document.getElementById('seo-desc').value=getM(html,'description');
  document.getElementById('seo-kw').value=getM(html,'keywords');
  document.getElementById('seo-ogtitle').value=getP(html,'og:title');
  document.getElementById('seo-ogdesc').value=getP(html,'og:description');
  document.getElementById('seo-fields').style.display='block';
  setLog(`${fname} загружен — редактируй SEO`);
}

async function saveSeoPage(siteId){
  if(!window._seoFile){toast('Сначала выбери страницу','error');return;}
  const site=SITES.find(s=>s.id===siteId);
  let html=window._seoFile.html;
  const title=getV('seo-title'),desc=getV('seo-desc'),kw=getV('seo-kw'),ogt=getV('seo-ogtitle'),ogd=getV('seo-ogdesc');
  // Update title
  html=html.replace(/<title[^>]*>[\s\S]*?<\/title>/i,`<title>${title}</title>`);
  // Update/insert meta description
  html=updateMeta(html,'description',desc);
  html=updateMeta(html,'keywords',kw);
  html=updateOgMeta(html,'og:title',ogt);
  html=updateOgMeta(html,'og:description',ogd);
  setLog(`Сохраняем SEO для ${window._seoFile.name}...`);
  const res=await ghPutFile(site.repo,window._seoFile.name,html,`CMS: SEO update → ${window._seoFile.name}`,window._seoFile.sha);
  if(res){
    window._seoFile.sha=res.content.sha;
    window._seoFile.html=html;
    addClog(`SEO обновлён: ${window._seoFile.name}`,site.name,'seo');
    toast(`✓ SEO сохранён для ${window._seoFile.name}`,'success');
    setLog(`✓ SEO сохранён`);
  }else{
    toast('Ошибка сохранения','error');
  }
}

function updateMeta(html,name,value){
  const re=new RegExp(`<meta([^>]+)name=["']${name}["']([^>]*)>`,'i');
  const newTag=`<meta name="${name}" content="${value}" />`;
  if(re.test(html))return html.replace(re,newTag);
  return html.replace('</head>',`${newTag}\n</head>`);
}
function updateOgMeta(html,prop,value){
  const re=new RegExp(`<meta([^>]+)property=["']${prop}["']([^>]*)>`,'i');
  const newTag=`<meta property="${prop}" content="${value}" />`;
  if(re.test(html))return html.replace(re,newTag);
  return html.replace('</head>',`${newTag}\n</head>`);
}

// ═══════════════════════════════════════════════════
// PAGE EDITOR
// ═══════════════════════════════════════════════════
async function loadEditorPage(siteId){
  const fname=document.getElementById('editor-file-select').value;
  if(!fname)return;
  setLog(`Загружаем ${fname}...`);
  const file=await ghGetFile(SITES.find(s=>s.id===siteId).repo,fname);
  if(!file){toast('Не удалось загрузить файл','error');return;}
  const html=decodeB64(file.content);
  window._editorFile={name:fname,sha:file.sha,html};
  // Extract editable elements
  const fields=[];
  const h1m=html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/gi)||[];
  const h2m=html.match(/<h2[^>]*>([\s\S]*?)<\/h2>/gi)||[];
  h1m.slice(0,3).forEach((m,i)=>{const txt=m.replace(/<[^>]+>/g,'').trim();fields.push({tag:'h1',index:i,label:`H1 заголовок ${h1m.length>1?i+1:''}`,value:txt,original:m});});
  h2m.slice(0,5).forEach((m,i)=>{const txt=m.replace(/<[^>]+>/g,'').trim();fields.push({tag:'h2',index:i,label:`H2 подзаголовок ${h2m.length>1?i+1:''}`,value:txt,original:m});});
  // ALT теги картинок
  const imgFields=[];
  const imgMatches=html.match(/<img[^>]+>/gi)||[];
  imgMatches.forEach((m,i)=>{
    const srcM=m.match(/src=["']([^"']+)["']/i);
    const altM=m.match(/alt=["']([^"']*)["']/i);
    const src=srcM?srcM[1].split('/').pop().split('?')[0]:'img-'+i;
    imgFields.push({tag:'img',index:i,label:'ALT картинки: '+src,value:altM?altM[1]:'',original:m,hasAlt:!!altM});
  });
  window._editorFields=fields;
  window._imgFields=imgFields;
  const container=document.getElementById('editor-fields');
  const total=fields.length+imgFields.length;
  if(!total){container.innerHTML='<div style="color:var(--muted);font-family:var(--mono);font-size:13px;">Заголовков H1/H2 и картинок не найдено</div>';return;}
  const headingsHtml=fields.length?`<div style="font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);">📝 Заголовки (${fields.length})</div>`+
    fields.map((f,i)=>`<div class="edit-field"><div class="edit-field-label">${f.label}</div><input type="text" id="ef-${i}" value="${esc(f.value)}" /></div>`).join(''):'';
  const altsHtml=imgFields.length?`<div style="font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);">🖼 ALT теги картинок (${imgFields.length})</div>`+
    imgFields.map((f,i)=>`<div class="edit-field"><div class="edit-field-label" style="color:${f.hasAlt?'var(--muted)':'var(--error)'};">${f.label}${f.hasAlt?'':' ❌ пусто'}</div><input type="text" id="ai-${i}" value="${esc(f.value)}" placeholder="Введи описание картинки..." /></div>`).join(''):'';
  container.innerHTML=`<div style="margin-bottom:14px;font-size:12px;color:var(--muted);font-family:var(--mono);">Найдено ${total} редактируемых элементов:</div>`+headingsHtml+altsHtml;
  document.getElementById('editor-save-btn').style.display='block';
  setLog(`${fname} загружен — ${fields.length} заголовков, ${imgFields.length} картинок`);
}

async function saveEditorPage(siteId){
  if(!window._editorFile||!window._editorFields){toast('Сначала выбери страницу','error');return;}
  const site=SITES.find(s=>s.id===siteId);
  let html=window._editorFile.html;
  // Сохраняем заголовки H1/H2
  window._editorFields.forEach((f,i)=>{
    const newVal=document.getElementById('ef-'+i).value.trim();
    if(newVal!==f.value){
      const newTag=f.original.replace(/>[\s\S]*?<\/h[12]>/i,`>${newVal}</${f.tag}>`);
      html=html.replace(f.original,newTag);
    }
  });
  // Сохраняем ALT теги картинок
  if(window._imgFields){
    window._imgFields.forEach((f,i)=>{
      const inp=document.getElementById('ai-'+i);
      if(!inp)return;
      const newAlt=inp.value.trim();
      if(newAlt!==f.value){
        let newTag;
        if(f.hasAlt){
          newTag=f.original.replace(/alt=["'][^"']*["']/i,`alt="${newAlt}"`);
        }else{
          newTag=f.original.replace(/\/?>$/, ` alt="${newAlt}">`);
        }
        html=html.replace(f.original,newTag);
      }
    });
  }
  setLog(`Сохраняем ${window._editorFile.name}...`);
  const res=await ghPutFile(site.repo,window._editorFile.name,html,`CMS: page edit → ${window._editorFile.name}`,window._editorFile.sha);
  if(res){
    window._editorFile.sha=res.content.sha;
    window._editorFile.html=html;
    addClog(`Отредактирована страница: ${window._editorFile.name}`,site.name,'page');
    toast(`✓ ${window._editorFile.name} сохранён`,'success');
    setLog('✓ Страница сохранена');
  }else{toast('Ошибка сохранения','error');}
}

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title||h1+' | '+site.name}</title>
<meta name="description" content="${metadesc}" />
</head>
<body>
<main style="max-width:1200px;margin:40px auto;padding:0 20px;">
  <h1>${h1}</h1>
  <div style="margin-top:24px;line-height:1.8;">
    ${body.split('\n').map(p=>p.trim()?`<p>${p}</p>`:'').join('\n')}
  </div>
</main>
</body>
</html>`;
  }
  setLog(`Создаём ${filename}...`);
  const res=await ghPutFile(site.repo,filename,template,`CMS: new page → ${filename}`,null);
  if(res){
    addClog(`Создана страница: ${filename}`,site.name,'page');

function renderBlogPosts(posts){
  if(!posts.length)return'<div style="color:var(--muted);font-size:13px;font-family:var(--mono);">Статей пока нет</div>';
  return posts.map((p,i)=>`
    <div class="blog-post-row">
      <div style="flex:1"><div class="post-title-text">${esc(p.title)}</div><div class="post-meta">${p.date} · ${p.slug}</div></div>
      <a href="${currentSite.siteUrl}${p.slug}" target="_blank" style="color:var(--accent);font-size:12px;font-family:var(--mono);text-decoration:none;margin-right:12px;">открыть ↗</a>
      <button class="del-btn" onclick="delBlogPost(${i})">✕</button>
    </div>`).join('');
}

async function createBlogPost(siteId){
  const site=SITES.find(s=>s.id===siteId);
  const title=getV('blog-title'),slug=getV('blog-slug'),date=getV('blog-date'),excerpt=getV('blog-excerpt'),body=getV('blog-body');
  if(!title||!slug){toast('Заполни заголовок и имя файла','error');return;}
  const filename=slug.endsWith('.html')?slug:slug+'.html';
  const html=`<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title} | ${site.name}</title>
<meta name="description" content="${excerpt}" />
<link rel="canonical" href="${site.siteUrl}${filename}" />
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"Article",
  "headline":"${title}",
  "datePublished":"${date}",
  "description":"${excerpt}",
  "author":{"@type":"Organization","name":"${site.name}"}
}
<\/script>
</head>
<body>
<main style="max-width:800px;margin:40px auto;padding:0 20px;font-family:sans-serif;line-height:1.8;">
  <article>
    <h1 style="font-size:32px;margin-bottom:8px;">${title}</h1>
    <p style="color:#888;font-size:14px;margin-bottom:32px;">${date}</p>
    <p style="font-size:18px;color:#555;margin-bottom:32px;"><em>${excerpt}</em></p>
    ${body.split('\n').map(p=>p.trim()?`<p>${p}</p>`:'').join('\n')}
  </article>
</main>
</body>
</html>`;
  setLog(`Публикуем ${filename}...`);
  const res=await ghPutFile(site.repo,filename,html,`CMS: blog post → ${filename}`,null);
  if(res){
    if(!siteData[siteId].blogPosts)siteData[siteId].blogPosts=[];
    siteData[siteId].blogPosts.unshift({title,slug:filename,date,excerpt});
    document.getElementById('blog-list').innerHTML=renderBlogPosts(siteData[siteId].blogPosts);
    ['blog-title','blog-slug','blog-excerpt','blog-body'].forEach(id=>document.getElementById(id).value='');
    addClog(`Опубликована статья: "${title}"`,site.name,'blog');
    toast(`✓ Статья опубликована`,'success');
    setLog('✓ Статья создана на GitHub');
  }else{toast('Ошибка. Файл уже существует?','error');}
}
function delBlogPost(i){const p=siteData[currentSite.id].blogPosts[i];siteData[currentSite.id].blogPosts.splice(i,1);document.getElementById('blog-list').innerHTML=renderBlogPosts(siteData[currentSite.id].blogPosts);addClog(`Удалена статья "${p.title}"`,currentSite.name,'delete');}

// ═══════════════════════════════════════════════════
// MENU
// ═══════════════════════════════════════════════════
function renderMenu(items){
  if(!items.length)return'<div style="color:var(--muted);font-size:13px;font-family:var(--mono);">Пунктов меню нет</div>';
  return items.map((item,i)=>`
    <div class="menu-item-row">
      <span class="menu-drag">⠿</span>
      <input type="text" value="${esc(item.label)}" onchange="siteData['${currentSite.id}'].menu[${i}].label=this.value" style="flex:1;min-width:0;" />
      <input type="text" value="${esc(item.url)}" onchange="siteData['${currentSite.id}'].menu[${i}].url=this.value" style="flex:2;min-width:0;color:var(--accent);" />
      <button class="del-btn" onclick="delMenuItem(${i})">✕</button>
    </div>`).join('');
}
function addMenuItem(sid){
  const label=getV('menu-label'),url=getV('menu-url');
  if(!label||!url){toast('Заполни название и ссылку','error');return;}
  if(!siteData[sid].menu)siteData[sid].menu=[];
  siteData[sid].menu.push({label,url});
  document.getElementById('menu-list').innerHTML=renderMenu(siteData[sid].menu);
  document.getElementById('menu-label').value='';document.getElementById('menu-url').value='';
  addClog(`Пункт меню "${label}"`,currentSite.name,'menu');
  toast('Добавлен пункт меню','info');
}
function delMenuItem(i){siteData[currentSite.id].menu.splice(i,1);document.getElementById('menu-list').innerHTML=renderMenu(siteData[currentSite.id].menu);}

// ═══════════════════════════════════════════════════
// SITEMAP
// ═══════════════════════════════════════════════════
function buildSitemap(site,htmlFiles,priority,freq){
  const today2=new Date().toISOString().split('T')[0];
  const urls=htmlFiles.map(f=>{
    const p=f.name==='index.html'?priority:'0.7';
    const url=f.name==='index.html'?site.siteUrl:`${site.siteUrl}${f.name}`;
    return`  <url>\n    <loc>${url}</loc>\n    <lastmod>${today2}</lastmod>\n    <changefreq>${freq}</changefreq>\n    <priority>${p}</priority>\n  </url>`;
  });
  return`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls.join('\n')}\n</urlset>`;
}

async function previewSitemap(siteId){
  const site=SITES.find(s=>s.id===siteId);
  const htmlFiles=getHtmlFiles(siteId);
  const priority=document.getElementById('sm-priority').value;
  const freq=document.getElementById('sm-freq').value;
  const xml=buildSitemap(site,htmlFiles,priority,freq);
  document.getElementById('sitemap-preview').innerHTML=`<div class="schema-preview">${esc(xml)}</div>`;
}

async function saveSitemap(siteId){
  const site=SITES.find(s=>s.id===siteId);
  const htmlFiles=getHtmlFiles(siteId);
  const priority=document.getElementById('sm-priority').value;
  const freq=document.getElementById('sm-freq').value;
  const xml=buildSitemap(site,htmlFiles,priority,freq);
  setLog('Обновляем sitemap.xml...');
  const existing=await ghGetFile(site.repo,'sitemap.xml');
  const res=await ghPutFile(site.repo,'sitemap.xml',xml,'CMS: update sitemap.xml',existing?existing.sha:null);
  if(res){
    addClog(`Sitemap обновлён (${htmlFiles.length} страниц)`,site.name,'save');
    toast(`✓ sitemap.xml обновлён (${htmlFiles.length} страниц)`,'success');
    setLog('✓ sitemap.xml обновлён');
  }else{toast('Ошибка обновления sitemap','error');}
}

// ═══════════════════════════════════════════════════
// SCHEMA
// ═══════════════════════════════════════════════════
function generateSchema(site,data){
  const avg=data.reviews&&data.reviews.length?(data.reviews.reduce((s,r)=>s+r.rating,0)/data.reviews.length).toFixed(1):null;
  const schema={"@context":"https://schema.org","@type":site.schemaType,"name":data.siteName||site.name,"url":data.siteUrl||site.siteUrl,"description":data.description||""};
  if(avg&&data.reviews.length){
    schema["aggregateRating"]={"@type":"AggregateRating","ratingValue":parseFloat(avg),"reviewCount":data.reviews.length,"bestRating":5,"worstRating":1};
    schema["review"]=data.reviews.map(r=>({"@type":"Review","author":{"@type":"Person","name":r.author},"reviewRating":{"@type":"Rating","ratingValue":r.rating,"bestRating":5},"reviewBody":r.text,"datePublished":r.date||today()}));
  }
  if(data.prices&&data.prices.length)schema["offers"]=data.prices.map(p=>({"@type":"Offer","name":p.name,"price":p.price,"priceCurrency":p.currency,"description":p.desc||"","availability":"https://schema.org/InStock"}));
  return JSON.stringify(schema,null,2);
}

function injectSchema(html,json){
  const tag=`<script type="application/ld+json">\n${json}\n<\/script>`;
  const c=html.replace(/<script\s+type="application\/ld\+json"[\s\S]*?<\/script>/gi,'');
  return c.includes('</head>')?c.replace('</head>',`${tag}\n</head>`):c+'\n'+tag;
}

function refreshSchema(sid){
  if(document.getElementById('info-sitename')){
    siteData[sid].siteName=getV('info-sitename');
    siteData[sid].siteUrl=getV('info-siteurl');
    siteData[sid].description=getV('info-desc');
  }
  const site=SITES.find(s=>s.id===sid);
  document.getElementById('schema-preview').textContent=`<script type="application/ld+json">\n${generateSchema(site,siteData[sid])}\n<\/script>`;
}

// ═══════════════════════════════════════════════════
// SAVE ALL
// ═══════════════════════════════════════════════════
async function saveAll(sid){
  const site=SITES.find(s=>s.id===sid);
  const data=siteData[sid];
  // Collect info fields if visible
  if(document.getElementById('info-sitename')){
    data.siteName=getV('info-sitename');
    data.siteUrl=getV('info-siteurl');
    data.description=getV('info-desc');
  }
  const btn=document.getElementById('save-btn');
  btn.disabled=true;
  try{
    const schemaJson=generateSchema(site,data);
    const jsonContent=JSON.stringify({reviews:data.reviews||[],prices:data.prices||[],promos:data.promos||[],blogPosts:data.blogPosts||[],menu:data.menu||[],description:data.description,siteName:data.siteName,siteUrl:data.siteUrl},null,2);
    btn.innerHTML='<div class="loading"></div> Сохраняем данные...';
    setLog('Сохраняем cms-data.json...');
    const jr=await ghPutFile(site.repo,'cms-data.json',jsonContent,'CMS: update data',data._sha);
    if(jr)siteData[sid]._sha=jr.content.sha;
    else throw new Error('Ошибка сохранения cms-data.json. Проверь GitHub Token (нужны права repo).');
    // Inject schema into all HTML files
    const htmlFiles=getHtmlFiles(sid);
    let updated=0;
    for(const f of htmlFiles){
      btn.innerHTML=`<div class="loading"></div> ${f.name} (${updated+1}/${htmlFiles.length})`;
      setLog(`Schema.org → ${f.name}...`);
      const fd=await ghGetFile(site.repo,f.name);
      if(!fd)continue;
      const html=decodeB64(fd.content);
      await ghPutFile(site.repo,f.name,injectSchema(html,schemaJson),`CMS: Schema.org → ${f.name}`,fd.sha);
      updated++;
    }
    addClog(`Сохранено: Schema.org в ${updated} страниц`,site.name,'save');
    toast(`✓ ${site.name}: обновлено ${updated} страниц`,'success');
    setLog(`✓ Готово! Обновлено ${updated} страниц`);
  }catch(err){
    toast('Ошибка: '+err.message,'error');
    setLog('Ошибка: '+err.message);
  }
  btn.innerHTML='💾 Сохранить всё на GitHub';
  btn.disabled=false;
}

// ═══════════════════════════════════════════════════
// LOG + TOAST
// ═══════════════════════════════════════════════════
function setLog(msg){document.getElementById('action-log').textContent=msg;}
function toast(msg,type='info'){
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(),10000);
  setLog(msg);
}
</script>
